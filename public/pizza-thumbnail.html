<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Thumbnail Generator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
    }
    .container {
      width: 1200px;
      height: 630px;
      background-color: #f5f5f7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid #ccc;
    }
    .logo {
      width: 300px;
      height: 300px;
    }
    h1 {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-size: 48px;
      color: #333;
      margin-top: 30px;
    }
    p {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-size: 24px;
      color: #666;
      text-align: center;
      max-width: 800px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="pizza-icon.svg" alt="Pizza Icon" class="logo">
    <h1>Ultimate Pizza Dough Calculator</h1>
    <p>Calculate the perfect pizza dough recipe for any style and size. Customize hydration, salt, and more for your ideal pizza.</p>
  </div>
</body>
</html>
